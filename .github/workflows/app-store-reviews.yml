name: App Store review intake

on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: retain-app-store-reviews
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install token signer
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Import reviews
        env:
          ASC_KEY_ID: ${{ secrets.ASC_REVIEW_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_REVIEW_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_REVIEW_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/app_store_reviews.py --apply
