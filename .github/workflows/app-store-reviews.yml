name: App Store review intake

on:
  schedule:
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: retain-app-store-reviews
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install token signer
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt
      - name: Import reviews
        id: import
        env:
          ASC_KEY_ID: ${{ secrets.ASC_REVIEW_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_REVIEW_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_REVIEW_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/app_store_reviews.py --apply
      - name: Record daily intake status
        if: always() && github.ref == 'refs/heads/main'
        env:
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
        run: |
          mkdir -p status
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          Path('status/latest.json').write_text(json.dumps({
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'outcome': os.environ['IMPORT_OUTCOME'],
              'runUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }, indent=2) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status/latest.json
          git commit -m 'Record review intake status'
          git push origin HEAD:main
